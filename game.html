<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>PvZ Fan</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;touch-action:none;user-select:none;font-family:system-ui,sans-serif}
  .ov{position:fixed;inset:0;z-index:100;color:#fff;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
  .ov.h{display:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #topbar{height:56px;background:#2a2a4a;display:flex;align-items:center;padding:env(safe-area-inset-top) 6px 0;gap:6px}
  #sunBox{background:#ffd700;color:#000;padding:6px 10px;border-radius:8px;font-weight:700;min-width:60px;text-align:center;font-size:14px;flex-shrink:0}
  #seeds{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
  #seeds::-webkit-scrollbar{display:none}
  .seed{flex:0 0 46px;height:46px;border-radius:8px;border:2px solid #555;background:#3a3a5a;color:#fff;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;padding:2px}
  .seed .e{font-size:16px}
  .seed.s{border-color:#0f0;box-shadow:0 0 8px #0f0}
  .seed.d{opacity:.35}
  canvas{display:block;width:100%;flex:1;touch-action:none}
  #dbg{position:fixed;top:calc(60px + env(safe-area-inset-top));left:6px;color:#0f0;font-size:11px;font-family:monospace;pointer-events:none;text-shadow:1px 1px 2px #000}
  #go{display:none;flex-direction:column;gap:16px;background:rgba(0,0,0,.85);z-index:90}
  #go h1{font-size:22px}
  .btn{padding:16px 28px;font-size:16px;font-weight:700;border:none;border-radius:12px;background:#4caf50;color:#fff;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 rgba(0,0,0,.3);min-width:180px}
  .btn:disabled{background:#444;color:#888;box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .btn.g{background:#555}
  #menu{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460)}
  #menu .c{text-align:center;max-width:360px;width:100%}
  #menu h1{font-size:34px;margin-bottom:8px;text-shadow:0 0 20px rgba(120,220,120,.6)}
  #menu .sub{font-size:13px;color:#8fb8de;margin-bottom:36px;font-style:italic}
  #menu .btn{display:block;width:100%;padding:20px;margin:12px 0;font-size:18px;border-radius:14px}
  #menu .hint{font-size:12px;color:#777;margin-top:12px}
  #ps{background:linear-gradient(135deg,#1a1a2e,#16213e);flex-direction:column;justify-content:flex-start;align-items:stretch;overflow-y:auto;padding:16px}
  .ps-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .ps-h h2{font-size:20px}
  #cnt{font-size:14px;color:#8fb8de;background:#2a2a4a;padding:6px 12px;border-radius:8px}
  #cnt.f{background:#4caf50}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-bottom:16px}
  .pc{background:#3a3a5a;border:2px solid #555;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;touch-action:manipulation;min-height:76px;justify-content:center}
  .pc .e{font-size:24px}
  .pc .n{font-size:9px;font-weight:600;text-align:center;line-height:1.1}
  .pc .c{font-size:10px;color:#ffd700;font-weight:700}
  .pc.s{border-color:#0f0;background:#2d4a2d;box-shadow:0 0 10px rgba(0,255,0,.4)}
  .lb{font-size:13px;color:#8fb8de;margin-bottom:8px}
  #bar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
  .slot{aspect-ratio:1;background:#1e1e2e;border:2px dashed #444;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;touch-action:manipulation;min-height:44px}
  .slot.f{background:#3a3a5a;border:2px solid #0f0}
  #psb{display:flex;gap:8px;margin-top:auto;padding-top:12px}
  #psb .btn{flex:1;min-width:0}
</style>
</head>
<body>

<div id="menu" class="ov">
  <div class="c">
    <h1>🌻 PvZ Fan</h1>
    <p class="sub">Fan yapımı, sınırsız mod</p>
    <button id="bS" class="btn">▶ Sınırsız Mod</button>
    <button id="bL" class="btn" disabled>🔒 Levelli Mod</button>
    <p class="hint">Levelli mod gelecekte gelecek</p>
  </div>
</div>

<div id="ps" class="ov h">
  <div class="ps-h"><h2>🌱 Bitkilerini Seç</h2><div id="cnt">0/7</div></div>
  <div id="grid"></div>
  <div class="lb">Seçilenler (slota tıkla → çıkar)</div>
  <div id="bar"></div>
  <div id="psb">
    <button id="bM" class="btn g">← Menü</button>
    <button id="bG" class="btn" disabled>▶ Başla</button>
  </div>
</div>

<div id="wrap">
  <div id="topbar"><div id="sunBox">☀ <span id="sv">50</span></div><div id="seeds"></div></div>
  <canvas id="cv"></canvas>
</div>
<div id="dbg"></div>
<div id="go" class="ov">
  <h1>🧟 Zombiler Evi Yedi!</h1>
  <button class="btn" onclick="game.startFromSelection()">Tekrar Dene</button>
  <button class="btn g" onclick="game.goToMenu()">Ana Menü</button>
</div>

<script>
// ============ AYARLAR ============
const CFG={COLS:9,ROWS:5,SUN0:50,SUNVAL:25,SKY_MIN:8,SKY_MAX:12,SUN_LIFE:12,ZFIRST:20,PEA_SPD:380,
  MINE_R:1.4,NEEDLE_SPD:280,MINI_DECAY:50,SHELL_DUR:.9,SHELL_PEAK:120,MAX_SLOTS:7,BURN_D:10};

const PL={
  sunflower:{n:"Ayçiçeği",c:50,hp:300,col:"#ffd700",em:"🌻",rate:20,first:5},
  peashooter:{n:"Bezelye",c:100,hp:300,col:"#4caf50",em:"🌱",dmg:25,cd:1.2},
  wallnut:{n:"Ceviz",c:50,hp:4000,col:"#8b5a2b",em:"🌰"},
  mine:{n:"Mayın",c:25,hp:300,col:"#c0392b",em:"💣",arm:15,dmg:400,max:3},
  ignear:{n:"İğneatar",c:125,hp:300,col:"#8e44ad",em:"🏹",dmg:15,cd:1.8,pierce:3,rt:4.5,wt:1.5,wm:.6},
  spike:{n:"Diken",c:75,hp:300,col:"#6b4226",em:"🪵",dmg:15,tick:1,max:4},
  anka:{n:"Anka",c:75,hp:700,col:"#e67e22",em:"🌺",hitD:15,hitCD:1.4,rt:1,gT:8,gD:65,gRT:1.5},
  shifaci:{n:"Şifacı",c:75,hp:300,col:"#2ecc71",em:"⚕️",heal:600,shield:150,cd:20,rt:1.5},
  anakok:{n:"Ana Kök",c:100,hp:300,col:"#27ae60",em:"🪴",dmg:35,cd:3,burst:3,bInt:.3,bMult:3,rest:4},
  alev:{n:"Alev Çiçeği",c:100,hp:300,col:"#e74c3c",em:"🔥",fire:5,direct:15,bT:6,max:3,lRT:1.5}
};

const ZB={
  normal:{n:"Normal",hp:240,spd:7,dmg:100,col:"#7a3b3b"},
  runner:{n:"Koşucu",hp:360,spd:10,dmg:150,col:"#b85a3b"},
  armored:{n:"Zırlı",hp:1440,spd:7,dmg:150,col:"#4a4a5a"}
};
const BADGE={runner:"💨",armored:"🛡️"};

// ============ UTILS ============
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rf=(a,b)=>Math.random()*(b-a)+a;
const col=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const byDist=(x,y)=>(a,b)=>Math.abs(a.x+a.w/2-x)-Math.abs(b.x+b.w/2-x);

class E{constructor(x,y,w,h){this.x=x;this.y=y;this.w=w;this.h=h;this.alive=1}get rect(){return{x:this.x,y:this.y,w:this.w,h:this.h}}update(){}draw(){}}

class Board{
  constructor(c,r,s,ox,oy){this.cols=c;this.rows=r;this.cw=s;this.ch=s;this.ox=ox;this.oy=oy;
    this.grid=Array.from({length:r},()=>Array(c).fill(null))}
  cellAt(px,py){const c=Math.floor((px-this.ox)/this.cw),r=Math.floor((py-this.oy)/this.ch);
    return r<0||r>=this.rows||c<0||c>=this.cols?null:{row:r,col:c}}
  center(r,c){return{x:this.ox+c*this.cw+this.cw/2,y:this.oy+r*this.ch+this.ch/2}}
  place(r,c,p){this.grid[r][c]=p}
  remove(r,c){this.grid[r][c]=null}
  isFree(r,c){return this.grid[r][c]===null}
}

class Boom{constructor(x,y,r,c){this.x=x;this.y=y;this.r=r;this.l=.5;this.ml=.5;this.alive=1;
  this.c1=c?c[0]:"255,180,0";this.c2=c?c[1]:"255,80,0"}
  update(dt){this.l-=dt;if(this.l<=0)this.alive=0}
  draw(ctx){const t=1-this.l/this.ml,a=this.l/this.ml,R=this.r*(.5+t*.5);
    ctx.fillStyle=`rgba(${this.c1},${a*.8})`;ctx.beginPath();ctx.arc(this.x,this.y,R,0,6.28);ctx.fill();
    ctx.fillStyle=`rgba(${this.c2},${a*.5})`;ctx.beginPath();ctx.arc(this.x,this.y,R*.6,0,6.28);ctx.fill()}}

class Heal{constructor(t,h,s){this.t=t;this.h=h;this.s=s;this.l=.9;this.ml=.9;this.alive=1}
  update(dt){this.l-=dt;if(this.l<=0)this.alive=0}
  draw(ctx){
    if(!this.t||!this.t.alive)return;
    const p=1-this.l/this.ml,a=this.l/this.ml;
    const cx=this.t.x+this.t.w/2,cy=this.t.y+this.t.h/2,R=this.t.w*.5+p*this.t.w*.8;
    ctx.strokeStyle=`rgba(46,204,113,${a})`;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,R,0,6.28);ctx.stroke();
    ctx.fillStyle=`rgba(46,204,113,${a*.3})`;ctx.beginPath();ctx.arc(cx,cy,R*.7,0,6.28);ctx.fill();
    ctx.fillStyle=`rgba(168,240,200,${a})`;ctx.font=`bold ${this.t.h*.35}px system-ui`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(`+${this.h}`,cx,cy-p*30);
    ctx.fillStyle=`rgba(52,152,219,${a})`;ctx.font=`bold ${this.t.h*.22}px system-ui`;
    ctx.fillText(`🛡+${this.s}`,cx,cy-p*30+this.t.h*.4);
  }}

// ============ MİNİ FİLİZ (yenilebilir) ============
class Mini extends E{
  constructor(r,c,x,y,w,h){super(x,y,w,h);this.row=r;this.col=c;this.hp=1000;this.mhp=1000;this.cd=0}
  update(dt,g){
    this.hp-=CFG.MINI_DECAY*dt;
    if(this.hp<=0){this.alive=0;return}
    this.cd-=dt;
    if(this.cd<=0&&g.zombies.some(z=>z.alive&&z.row===this.row&&z.x>this.x+this.w)){
      this.cd=1;g.peas.push(new Pea(this.x+this.w,this.y+this.h*.35,this.row,10,null));
    }
  }
  hit(d){this.hp-=d;if(this.hp<=0)this.alive=0}
  draw(ctx){
    const r=this.hp/this.mhp,cx=this.x+this.w/2;
    ctx.fillStyle="#3d2817";ctx.beginPath();ctx.ellipse(cx,this.y+this.h*.85,this.w*.42,this.h*.12,0,0,6.28);ctx.fill();
    ctx.fillStyle="#2e7d32";ctx.fillRect(cx-2,this.y+this.h*.45,4,this.h*.4);
    ctx.fillStyle="#66bb6a";
    ctx.beginPath();ctx.ellipse(cx-this.w*.18,this.y+this.h*.5,this.w*.18,this.h*.08,-.5,0,6.28);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+this.w*.18,this.y+this.h*.5,this.w*.18,this.h*.08,.5,0,6.28);ctx.fill();
    ctx.fillStyle="#a5d6a7";ctx.beginPath();ctx.arc(cx,this.y+this.h*.32,this.w*.13,0,6.28);ctx.fill();
    ctx.strokeStyle="#1e8449";ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle="#000";ctx.fillRect(this.x,this.y-4,this.w,3);
    ctx.fillStyle=r<.3?"#e74c3c":(r<.6?"#f39c12":"#2ecc71");ctx.fillRect(this.x,this.y-4,this.w*r,3);
  }}

// ============ MERMİLER ============
class Pea extends E{
  constructor(x,y,row,dmg,owner){super(x,y,14,14);this.row=row;this.dmg=dmg;this.owner=owner}
  update(dt,g){
    this.x+=CFG.PEA_SPD*dt;
    if(this.x>g.width+30){this.alive=0;return}
    let t=null,bx=1e9;
    for(const z of g.zombies){
      if(!z.alive||z.row!==this.row)continue;
      if(col(this.rect,z.rect)&&z.x<bx){bx=z.x;t=z}
    }
    if(t){t.hit(this.dmg);
      if(!t.alive&&this.owner&&this.owner.alive&&this.owner.type==="anakok")g.onMotherKill(this.owner,t);
      this.alive=0}
  }
  draw(ctx){ctx.fillStyle="#8bc34a";ctx.beginPath();ctx.arc(this.x+7,this.y+7,7,0,6.28);ctx.fill()}
}

class Needle extends E{
  constructor(x,y,row,maxX){super(x,y,22,10);this.row=row;this.maxX=maxX;this.hits=new Set()}
  update(dt,g){
    this.x+=CFG.NEEDLE_SPD*dt;
    if(this.x>this.maxX){this.alive=0;return}
    for(const z of g.zombies){
      if(!z.alive||z.row!==this.row||this.hits.has(z))continue;
      if(col(this.rect,z.rect)){
        z.hit(PL.ignear.dmg);z.weakenTimer=PL.ignear.wt;this.hits.add(z);
        if(this.hits.size>=PL.ignear.pierce){this.alive=0;return}
      }
    }
  }
  draw(ctx){
    ctx.fillStyle="#8e44ad";ctx.beginPath();
    ctx.moveTo(this.x,this.y+5);ctx.lineTo(this.x+15,this.y);ctx.lineTo(this.x+22,this.y+5);ctx.lineTo(this.x+15,this.y+10);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle="#d2a4f0";ctx.lineWidth=1;ctx.stroke();
  }}

class Shell extends E{
  constructor(sx,sy,ex,row,dmg,owner){super(sx,sy,22,22);this.sx=sx;this.sy=sy;this.ex=ex;
    this.row=row;this.dmg=dmg;this.owner=owner;this.t=0}
  update(dt,g){
    this.t+=dt;
    const p=Math.min(1,this.t/CFG.SHELL_DUR);
    this.x=this.sx+(this.ex-this.sx)*p;
    this.y=this.sy-Math.sin(p*Math.PI)*CFG.SHELL_PEAK;
    if(p>=1){g.explodeShell(this);this.alive=0}
  }
  draw(ctx){
    const cx=this.x+11,cy=this.y+11;
    const c=this.owner&&this.owner.type==="anakok"
      ?["#1e8449","#27ae60","#a5d6a7"]
      :["#e74c3c","#ff8c00","#ffd700"];
    ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(cx,cy,11,0,6.28);ctx.fill();
    ctx.fillStyle=c[1];ctx.beginPath();ctx.arc(cx,cy,8,0,6.28);ctx.fill();
    ctx.fillStyle=c[2];ctx.beginPath();ctx.arc(cx,cy,4,0,6.28);ctx.fill();
  }}

class Sun extends E{
  constructor(x,y,ty){super(x-18,y-18,36,36);this.ty=ty;this.l=CFG.SUN_LIFE}
  update(dt){if(this.y+18<this.ty)this.y+=80*dt;this.l-=dt;if(this.l<=0)this.alive=0}
  draw(ctx){
    ctx.fillStyle="#ffd700";ctx.beginPath();ctx.arc(this.x+18,this.y+18,18,0,6.28);ctx.fill();
    ctx.strokeStyle="#ffaa00";ctx.lineWidth=2;ctx.stroke();
    ctx.font="18px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("☀",this.x+18,this.y+18);
  }}

// ============ BİTKİ ÇİZİMLERİ ============
function drawBase(p,ctx){
  const armed=p.type!=="mine"||p.armTimer<=0;
  ctx.fillStyle=armed?p.color:"#555";ctx.fillRect(p.x+2,p.y+2,p.w-4,p.h-4);
  if(p.type==="shifaci"&&p.shield>0){ctx.strokeStyle="#3498db";ctx.lineWidth=2;
    ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2)}
  ctx.font=`${p.h*.55}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(p.em,p.x+p.w/2,p.y+p.h/2);
  if(p.type==="shifaci"){
    const pct=1-p.cd/PL.shifaci.cd;
    ctx.strokeStyle="#a8f0c8";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x+p.w*.82,p.y+p.h*.18,p.h*.12,-1.57,-1.57+pct*6.28);ctx.stroke();
  }
  if(p.type==="mine"&&!armed){ctx.strokeStyle="#f00";ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(p.x+6,p.y+6);ctx.lineTo(p.x+p.w-6,p.y+p.h-6);
    ctx.moveTo(p.x+p.w-6,p.y+6);ctx.lineTo(p.x+6,p.y+p.h-6);ctx.stroke()}
}

function drawSpike(p,ctx){
  ctx.fillStyle="#6b4226";ctx.fillRect(p.x+2,p.y+p.h*.55,p.w-4,p.h*.4);
  ctx.fillStyle="#a8724a";
  const n=5,sw=(p.w-4)/n;
  for(let i=0;i<n;i++){const sx=p.x+2+i*sw+sw/2,sy=p.y+p.h*.55;
    ctx.beginPath();ctx.moveTo(sx-sw*.35,sy);ctx.lineTo(sx,sy-p.h*.32);ctx.lineTo(sx+sw*.35,sy);ctx.closePath();ctx.fill()}
}

function drawAnka(p,ctx){
  const pu=.45+.25*Math.sin(performance.now()/180);
  ctx.fillStyle=`rgba(230,126,34,${pu})`;ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.strokeStyle=`rgba(255,200,120,${pu+.2})`;ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h);
  ctx.font=`${p.h*.6}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("👻",p.x+p.w/2,p.y+p.h/2);
}

function drawAna(p,ctx){
  const cx=p.x+p.w/2;
  ctx.fillStyle="#3d2817";ctx.beginPath();ctx.ellipse(cx,p.y+p.h*.88,p.w*.42,p.h*.12,0,0,6.28);ctx.fill();
  ctx.fillStyle="#2e7d32";ctx.fillRect(cx-3,p.y+p.h*.35,6,p.h*.5);
  ctx.fillStyle="#4caf50";
  ctx.beginPath();ctx.ellipse(cx-p.w*.2,p.y+p.h*.42,p.w*.2,p.h*.09,-.5,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+p.w*.2,p.y+p.h*.42,p.w*.2,p.h*.09,.5,0,6.28);ctx.fill();
  ctx.strokeStyle="#5d4037";ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx,p.y+p.h*.8);ctx.lineTo(cx-p.w*.25,p.y+p.h*.98);
  ctx.moveTo(cx,p.y+p.h*.8);ctx.lineTo(cx,p.y+p.h*.98);
  ctx.moveTo(cx,p.y+p.h*.8);ctx.lineTo(cx+p.w*.25,p.y+p.h*.98);
  ctx.stroke();
  ctx.fillStyle="#a5d6a7";ctx.beginPath();ctx.arc(cx,p.y+p.h*.28,p.w*.14,0,6.28);ctx.fill();
  ctx.strokeStyle="#1e8449";ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle="#fff";ctx.beginPath();
  ctx.arc(cx-p.w*.08,p.y+p.h*.55,p.w*.05,0,6.28);ctx.arc(cx+p.w*.08,p.y+p.h*.55,p.w*.05,0,6.28);ctx.fill();
  ctx.fillStyle="#000";ctx.beginPath();
  ctx.arc(cx-p.w*.07,p.y+p.h*.55,p.w*.025,0,6.28);ctx.arc(cx+p.w*.09,p.y+p.h*.55,p.w*.025,0,6.28);ctx.fill();
  // burst veya rest durumunda kırmızı/sarı çerçeve
  if(p.burstCount>0){const pu=.5+.5*Math.sin(performance.now()/80);
    ctx.strokeStyle=`rgba(255,60,0,${pu})`;ctx.lineWidth=3;ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2)}
  else if(p.restTimer>0){ctx.strokeStyle="rgba(180,180,180,.6)";ctx.lineWidth=2;
    ctx.setLineDash([4,4]);ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2);ctx.setLineDash([])}
}

function drawAlev(p,ctx){
  const cx=p.x+p.w/2,cy=p.y+p.h*.38;
  const pu=.3+.2*Math.sin(performance.now()/200);
  ctx.fillStyle=`rgba(255,140,40,${pu})`;ctx.beginPath();ctx.arc(cx,p.y+p.h*.5,p.w*.5,0,6.28);ctx.fill();
  ctx.fillStyle="#2e7d32";
  ctx.beginPath();ctx.ellipse(cx-p.w*.22,p.y+p.h*.82,p.w*.16,p.h*.09,-.4,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+p.w*.22,p.y+p.h*.82,p.w*.16,p.h*.09,.4,0,6.28);ctx.fill();
  const cs=["#e74c3c","#ff5722","#ff8c00","#ff5722","#e74c3c"];
  for(let i=0;i<5;i++){const a=(i/5)*6.28-1.57;
    ctx.fillStyle=cs[i];ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*p.w*.22,cy+Math.sin(a)*p.h*.2,p.w*.13,0,6.28);ctx.fill()}
  ctx.fillStyle="#ffd700";ctx.beginPath();ctx.arc(cx,cy,p.w*.12,0,6.28);ctx.fill();
  ctx.fillStyle="#ff5722";ctx.beginPath();ctx.arc(cx,cy,p.w*.07,0,6.28);ctx.fill();
}

const DW={spike:drawSpike,anakok:drawAna,alev:drawAlev};

// ============ BİTKİ DAVRANIŞLARI ============
const findFirst=(p,g)=>{let t=null,bx=1e9;
  for(const z of g.zombies){if(!z.alive||z.row!==p.row)continue;if(z.x>p.x+p.w&&z.x<bx){bx=z.x;t=z}}return t};

const BH={
  sunflower(p,dt,g){p.sunTimer-=dt;if(p.sunTimer<=0){p.sunTimer=PL.sunflower.rate;g.spawnSun(p.x+p.w/2,p.y+p.h/2)}},
  peashooter(p,dt,g){p.cd-=dt;if(p.cd<=0&&g.zombieInRow(p.row,p.x+p.w)){p.cd=PL.peashooter.cd;
    g.peas.push(new Pea(p.x+p.w,p.y+p.h*.35,p.row,PL.peashooter.dmg,null))}},
  anakok(p,dt,g){
    // rest: 4 sn hareketsiz
    if(p.restTimer>0){p.restTimer-=dt;return}
    if(p.burstCount>0){
      p.burstTimer-=dt;
      if(p.burstTimer<=0){
        const t=findFirst(p,g);
        if(t){
          g.shells.push(new Shell(p.x+p.w*.5,p.y-10,t.x+t.w/2,p.row,PL.anakok.dmg*PL.anakok.bMult,p));
          p.burstCount--;p.burstTimer=PL.anakok.bInt;
          if(p.burstCount<=0)p.restTimer=PL.anakok.rest;
        } else {p.burstCount=0;p.restTimer=PL.anakok.rest}
      }
    } else {
      p.cd-=dt;
      if(p.cd<=0){
        const t=findFirst(p,g);
        if(t){p.cd=PL.anakok.cd;
          g.shells.push(new Shell(p.x+p.w*.5,p.y-10,t.x+t.w/2,p.row,PL.anakok.dmg,p))}
      }
    }
  },
  alev(p,dt,g){
    p.cd-=dt;
    if(p.cd<=0){
      const t=findFirst(p,g);
      if(t){p.cd=PL.alev.fire;g.shells.push(new Shell(p.x+p.w*.5,p.y-10,t.x+t.w/2,p.row,PL.alev.direct,p))}
    }
  },
  ignear(p,dt,g){
    p.cd-=dt;
    const end=p.x+p.w+g.board.cw*PL.ignear.rt;
    if(p.cd<=0&&g.zombies.some(z=>z.alive&&z.row===p.row&&z.x>p.x+p.w&&z.x<end)){
      p.cd=PL.ignear.cd;g.needles.push(new Needle(p.x+p.w,p.y+p.h*.4,p.row,end))
    }
  },
  mine(p,dt,g){
    if(p.armTimer>0)p.armTimer-=dt;
    if(p.armTimer<=0&&g.mineTriggered(p)){g.explodeMine(p);p.alive=0;
      if(g.board.grid[p.row][p.col]===p)g.board.remove(p.row,p.col)}
  },
  spike(p,dt,g){
    p.tickTimer-=dt;
    if(p.tickTimer<=0){
      p.tickTimer=PL.spike.tick;
      const top=[];
      for(const z of g.zombies){if(!z.alive||z.row!==p.row)continue;if(col(p.rect,z.rect))top.push(z)}
      for(const z of top.slice(0,PL.spike.max))z.hit(PL.spike.dmg);
    }
  },
  anka(p,dt,g){
    const near=(cx,r)=>{let t=null,bd=1e9;
      for(const z of g.zombies){if(!z.alive)continue;const d=Math.abs(z.x+z.w/2-cx);
        if(d<=r&&d<bd){bd=d;t=z}}return t};
    if(p.form===1){
      p.cd-=dt;
      if(p.cd<=0){const t=near(p.x+p.w/2,p.w*PL.anka.rt);
        if(t){t.hit(PL.anka.hitD);p.cd=PL.anka.hitCD}}
    } else {
      p.formTimer-=dt;
      if(p.formTimer<=0){p.alive=0;return}
      const t=near(p.x+p.w/2,p.w*PL.anka.gRT);
      if(t)t.hit(PL.anka.gD*dt);
    }
  },
  shifaci(p,dt,g){
    p.cd-=dt;
    if(p.cd<=0){
      const max=p.w*PL.shifaci.rt;
      let t=null;
      for(const o of g.plants){
        if(!o.alive||o===p||o.row!==p.row)continue;
        if(o.x>p.x+p.w*.3&&(o.x-p.x)<max&&(!t||o.x<t.x))t=o;
      }
      if(!t&&p.hp<p.mhp)t=p;
      if(t){
        t.hp=Math.min(t.mhp,t.hp+PL.shifaci.heal);
        t.shield+=PL.shifaci.shield;t.healFlash=.9;
        g.effects.push(new Heal(t,PL.shifaci.heal,PL.shifaci.shield));
        p.cd=PL.shifaci.cd;
      }
    }
  }
};

// ============ PLANT ============
class Plant extends E{
  constructor(type,row,c,x,y,w,h){
    super(x,y,w,h);
    this.type=type;this.row=row;this.col=c;
    const d=PL[type];
    this.hp=d.hp;this.mhp=d.hp;this.color=d.col;this.em=d.em;
    this.cd=0;this.form=1;this.formTimer=0;this.shield=0;this.healFlash=0;
    this.burstCount=0;this.burstTimer=0;this.restTimer=0;
    if(type==="sunflower")this.sunTimer=d.first;
    if(type==="mine")this.armTimer=d.arm;
    if(type==="spike")this.tickTimer=d.tick;
    if(type==="shifaci")this.cd=d.cd;
  }
  update(dt,g){BH[this.type]?.(this,dt,g)}
  hit(d){
    if(this.type==="anka"&&this.form===2)return;
    if(this.shield>0){if(d<=this.shield){this.shield-=d;return}d-=this.shield;this.shield=0}
    this.hp-=d;
    if(this.hp<=0){if(this.type==="anka"&&this.form===1)this.hp=0;else this.alive=0}
  }
  draw(ctx){
    if(this.type==="anka"&&this.form===2){drawAnka(this,ctx);return}
    (DW[this.type]||drawBase)(this,ctx);
    if(this.healFlash>0){const a=this.healFlash/.9;
      ctx.fillStyle=`rgba(255,255,255,${a*.6})`;ctx.fillRect(this.x+2,this.y+2,this.w-4,this.h-4)}
    // HP bar
    if(this.type!=="spike"&&(this.hp<this.mhp||this.shield>0)&&this.hp>0){
      ctx.fillStyle="#000";ctx.fillRect(this.x,this.y-4,this.w,3);
      ctx.fillStyle="#0f0";ctx.fillRect(this.x,this.y-4,this.w*(this.hp/this.mhp),3);
      if(this.shield>0){ctx.fillStyle="#3498db";
        ctx.fillRect(this.x,this.y-7,this.w*Math.min(1,this.shield/(this.mhp*.5)),2)}
    }
  }
}

// ============ ZOMBIE ============
class Zombie extends E{
  constructor(type,row,x,y,w,h){
    super(x,y,w,h);this.type=type;this.row=row;
    const d=ZB[type];
    this.hp=d.hp;this.mhp=d.hp;this.speed=d.spd;this.dmg=d.dmg;this.color=d.col;
    this.weakenTimer=0;this.burnTimer=0;
  }
  update(dt,g){
    if(this.weakenTimer>0)this.weakenTimer-=dt;
    if(this.burnTimer>0){this.hit(CFG.BURN_D*dt);this.burnTimer-=dt}
    const dmg=this.weakenTimer>0?this.dmg*PL.ignear.wm:this.dmg;
    const t=g.plantInFront(this);
    if(t)t.hit(dmg*dt);else this.x-=this.speed*dt;
    if(this.x+this.w<g.board.ox)g.gameOver();
  }
  hit(d){this.hp-=d;if(this.hp<=0)this.alive=0}
  draw(ctx){
    ctx.fillStyle=this.color;ctx.fillRect(this.x,this.y,this.w,this.h);
    if(this.weakenTimer>0){ctx.fillStyle="rgba(160,80,220,.35)";ctx.fillRect(this.x,this.y,this.w,this.h)}
    if(this.burnTimer>0){
      const pu=.4+.3*Math.sin(performance.now()/100);
      ctx.fillStyle=`rgba(255,120,0,${pu})`;ctx.fillRect(this.x,this.y,this.w,this.h);
      ctx.font=`${this.h*.35}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("🔥",this.x+this.w*.5,this.y+this.h*.15);
    }
    ctx.font=`${this.h*.55}px serif`;ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText("🧟",this.x,this.y+this.h/2);
    const badge=BADGE[this.type];
    if(badge){ctx.font=`${this.h*(this.type==="armored"?.35:.3)}px serif`;
      ctx.textAlign=this.type==="runner"?"left":"center";
      ctx.fillText(badge,this.type==="runner"?this.x+this.w*.55:this.x+this.w*.5,
        this.y+this.h*(this.type==="runner"?.25:.3))}
    if(this.weakenTimer>0){ctx.font=`${this.h*.28}px serif`;ctx.textAlign="center";ctx.fillText("💜",this.x+this.w*.85,this.y+this.h*.15)}
    ctx.fillStyle="#000";ctx.fillRect(this.x,this.y-4,this.w,3);
    ctx.fillStyle=this.burnTimer>0?"#ff8c00":"#f00";
    ctx.fillRect(this.x,this.y-4,this.w*(this.hp/this.mhp),3);
  }
}

// ============ GAME ============
class Game{
  constructor(cv){
    this.cv=cv;this.ctx=cv.getContext("2d");
    this.width=0;this.height=0;this.lastTime=0;
    this._fps=0;this._fr=0;this._ft=0;
    this.state="menu";
    this.selectedPlants=["sunflower","peashooter","wallnut","mine"];
    this._loop=this.loop.bind(this);
  }
  showMenu(){
    this.state="menu";
    document.getElementById("menu").classList.remove("h");
    document.getElementById("ps").classList.add("h");
    document.getElementById("topbar").style.display="none";
    document.getElementById("dbg").style.display="none";
    document.getElementById("go").style.display="none";
  }
  showPlantSelect(){
    this.state="plantSelect";
    document.getElementById("menu").classList.add("h");
    document.getElementById("ps").classList.remove("h");
    document.getElementById("topbar").style.display="none";
    document.getElementById("dbg").style.display="none";
    document.getElementById("go").style.display="none";
    this.renderPS();
  }
  startFromSelection(){
    if(this.state==="playing")return;
    this.reset();this.state="playing";
    document.getElementById("menu").classList.add("h");
    document.getElementById("ps").classList.add("h");
    document.getElementById("topbar").style.display="flex";
    document.getElementById("dbg").style.display="block";
    document.getElementById("go").style.display="none";
    this.lastTime=performance.now();
  }
  goToMenu(){this.showMenu()}
  gameOver(){
    if(this.state==="over")return;
    this.state="over";
    document.getElementById("go").style.display="flex";
  }
  onMotherKill(mother,z){
    const c=this.board.cellAt(z.x+z.w/2,z.y+z.h/2);
    if(!c)return;
    let occ=!this.board.isFree(c.row,c.col);
    if(!occ)for(const m of this.minis)if(m.alive&&m.row===c.row&&m.col===c.col){occ=1;break}
    if(occ){
      // yer dolu → kendini boostla: 3 hızlı atış + 4 sn rest
      mother.burstCount=PL.anakok.burst;
      mother.burstTimer=0;
      mother.restTimer=0;
    } else {
      const cc=this.board.center(c.row,c.col);
      const w=this.board.cw*.6,h=this.board.ch*.6;
      this.minis.push(new Mini(c.row,c.col,cc.x-w/2,cc.y-h/2,w,h));
    }
  }
  explodeShell(s){
    const isAna=s.owner&&s.owner.type==="anakok";
    const maxT=isAna?1:PL.alev.max;
    const r=this.board.cw*PL.alev.lRT;
    const arr=[];
    for(const z of this.zombies){
      if(!z.alive||z.row!==s.row)continue;
      const d=Math.abs(z.x+z.w/2-s.ex);
      if(d<=r)arr.push({z,d});
    }
    arr.sort((a,b)=>a.d-b.d);
    for(const t of arr.slice(0,maxT)){
      t.z.hit(s.dmg);
      if(!isAna)t.z.burnTimer=PL.alev.bT;
      if(!t.z.alive&&isAna&&s.owner.alive)this.onMotherKill(s.owner,t.z);
    }
    if(!isAna){
      const cy=this.board.oy+s.row*this.board.ch+this.board.ch/2;
      this.effects.push(new Boom(s.ex,cy,this.board.cw,["255,140,0","255,60,0"]));
    }
  }
  renderPS(){
    const g=document.getElementById("grid");g.innerHTML="";
    for(const [t,d] of Object.entries(PL)){
      const c=document.createElement("div");
      c.className="pc"+(this.selectedPlants.includes(t)?" s":"");
      c.innerHTML=`<div class="e">${d.em}</div><div class="n">${d.n}</div><div class="c">☀${d.c}</div>`;
      const h=e=>{e.preventDefault();this.togglePlant(t)};
      c.addEventListener("touchstart",h,{passive:false});
      c.addEventListener("click",h);
      g.appendChild(c);
    }
    const b=document.getElementById("bar");b.innerHTML="";
    for(let i=0;i<CFG.MAX_SLOTS;i++){
      const s=document.createElement("div");s.className="slot";
      if(i<this.selectedPlants.length){
        s.classList.add("f");s.textContent=PL[this.selectedPlants[i]].em;
        const h=e=>{e.preventDefault();this.removeSlot(i)};
        s.addEventListener("touchstart",h,{passive:false});
        s.addEventListener("click",h);
      }
      b.appendChild(s);
    }
    const ct=this.selectedPlants.length;
    const c=document.getElementById("cnt");
    c.textContent=`${ct}/${CFG.MAX_SLOTS}`;
    c.classList.toggle("f",ct>=CFG.MAX_SLOTS);
    document.getElementById("bG").disabled=ct<1;
  }
  togglePlant(t){
    const i=this.selectedPlants.indexOf(t);
    if(i>=0)this.selectedPlants.splice(i,1);
    else if(this.selectedPlants.length<CFG.MAX_SLOTS)this.selectedPlants.push(t);
    this.renderPS();
  }
  removeSlot(i){this.selectedPlants.splice(i,1);this.renderPS()}
  reset(){
    this.board=this.makeBoard();
    this.sun=CFG.SUN0;this.skyTimer=rf(CFG.SKY_MIN,CFG.SKY_MAX);
    this.wave=0;this.queue=[];this.spawnT=0;this.spawnI=0;this.nextW=CFG.ZFIRST;this.lastVal=0;
    this.plants=[];this.zombies=[];this.peas=[];this.needles=[];this.shells=[];
    this.minis=[];this.suns=[];this.effects=[];
    this.selected=null;
    this.lastTime=performance.now();
    this.buildSeedBar();this.refreshSeeds();
  }
  makeBoard(){
    const s=Math.min(this.width/CFG.COLS,this.height/CFG.ROWS);
    return new Board(CFG.COLS,CFG.ROWS,s,(this.width-s*CFG.COLS)/2,(this.height-s*CFG.ROWS)/2);
  }
  resize(){
    const r=this.cv.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    this.width=r.width;this.height=r.height;
    this.cv.width=r.width*dpr;this.cv.height=r.height*dpr;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    if(this.board)this.board=this.makeBoard();
  }
  buildSeedBar(){
    const el=document.getElementById("seeds");el.innerHTML="";
    for(const type of this.selectedPlants){
      const d=PL[type];
      const b=document.createElement("button");
      b.className="seed";b.dataset.type=type;
      b.innerHTML=`<span class="e">${d.em}</span><span>${d.c}</span>`;
      const h=e=>{e.preventDefault();this.selectSeed(type)};
      b.addEventListener("touchstart",h,{passive:false});
      b.addEventListener("click",h);
      el.appendChild(b);
    }
  }
  spawnSun(x,y){this.suns.push(new Sun(x,y,Math.min(this.height-50,y+ri(40,90))))}
  zombieInRow(row,fromX){return this.zombies.some(z=>z.alive&&z.row===row&&z.x>fromX)}
  // plantInFront: hem bitkiler hem mini'ler yenilebilir
  plantInFront(z){
    let best=null,bx=-1e9;
    for(const p of this.plants){
      if(!p.alive||p.row!==z.row)continue;
      if(p.type==="spike")continue;
      if(p.type==="anka"&&p.form===2)continue;
      if(col(z.rect,p.rect)&&(p.x+p.w)>bx){bx=p.x+p.w;best=p}
    }
    for(const m of this.minis){
      if(!m.alive||m.row!==z.row)continue;
      if(col(z.rect,m.rect)&&(m.x+m.w)>bx){bx=m.x+m.w;best=m}
    }
    return best;
  }
  mineTriggered(m){
    const cx=m.x+m.w/2,cy=m.y+m.h/2,r=m.w*CFG.MINE_R;
    return this.zombies.some(z=>{
      if(!z.alive)return 0;
      const dx=z.x+z.w/2-cx,dy=z.y+z.h/2-cy;
      return dx*dx+dy*dy<r*r;
    });
  }
  explodeMine(m){
    const cx=m.x+m.w/2,cy=m.y+m.h/2,r=m.w*CFG.MINE_R;
    const arr=[];
    for(const z of this.zombies){
      if(!z.alive)continue;
      const dx=z.x+z.w/2-cx,dy=z.y+z.h/2-cy;
      const d2=dx*dx+dy*dy;
      if(d2<r*r)arr.push({z,d2});
    }
    arr.sort((a,b)=>a.d2-b.d2);
    for(const t of arr.slice(0,PL.mine.max))t.z.hit(PL.mine.dmg);
    this.effects.push(new Boom(cx,cy,r));
  }
  tryPlant(row,c,type){
    if(!this.board.isFree(row,c))return 0;
    for(const m of this.minis)if(m.alive&&m.row===row&&m.col===c)return 0;
    if(this.sun<PL[type].c)return 0;
    const cc=this.board.center(row,c);
    const w=this.board.cw*.8,h=this.board.ch*.8;
    const p=new Plant(type,row,c,cc.x-w/2,cc.y-h/2,w,h);
    this.plants.push(p);this.board.place(row,c,p);
    this.sun-=PL[type].c;
    this.refreshSeeds();
    return 1;
  }
  collectSun(s){s.alive=0;this.sun+=CFG.SUNVAL;this.refreshSeeds()}
  onPointer(px,py){
    if(this.state!=="playing")return;
    for(let i=this.suns.length-1;i>=0;i--){
      const s=this.suns[i];
      if(px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h){this.collectSun(s);return}
    }
    if(this.selected){
      const c=this.board.cellAt(px,py);
      if(c&&this.tryPlant(c.row,c.col,this.selected)){this.selected=null;this.refreshSeeds()}
    }
  }
  selectSeed(t){
    if(this.selected===t)this.selected=null;
    else if(this.sun>=PL[t].c)this.selected=t;
    this.refreshSeeds();
  }
  refreshSeeds(){
    document.querySelectorAll(".seed").forEach(el=>{
      const t=el.dataset.type;
      el.classList.toggle("s",this.selected===t);
      el.classList.toggle("d",this.sun<PL[t].c);
    });
  }
  loop(t){
    this._fr++;
    if(t-this._ft>500){this._fps=Math.round(this._fr*1000/(t-this._ft));this._fr=0;this._ft=t}
    if(this.state==="playing"){
      const dt=cl((t-this.lastTime)/1000||0,0,.05);
      this.update(dt);this.draw();
    }
    this.lastTime=t;
    requestAnimationFrame(this._loop);
  }
  update(dt){
    this.skyTimer-=dt;
    if(this.skyTimer<=0){this.skyTimer=rf(CFG.SKY_MIN,CFG.SKY_MAX);
      this.spawnSun(rf(this.board.ox+30,this.board.ox+this.board.cols*this.board.cw-30),-20)}
    this.nextW-=dt;
    if(this.nextW<=0){this.wave++;this.buildWave();this.nextW=this.waveInt(this.wave)}
    if(this.queue.length>0){
      this.spawnT-=dt;
      if(this.spawnT<=0){this.spawnZ(this.queue.shift());this.spawnT=this.spawnI}
    }
    for(const p of this.plants)p.update(dt,this);
    for(const z of this.zombies)z.update(dt,this);
    for(const p of this.peas)p.update(dt,this);
    for(const n of this.needles)n.update(dt,this);
    for(const s of this.shells)s.update(dt,this);
    for(const m of this.minis)m.update(dt,this);
    for(const s of this.suns)s.update(dt);
    for(const e of this.effects)e.update(dt);
    for(const p of this.plants){
      if(p.healFlash>0)p.healFlash-=dt;
      if(p.type==="anka"&&p.form===1&&p.hp<=0){
        p.form=2;p.formTimer=PL.anka.gT;p.hp=0;
        if(this.board.grid[p.row][p.col]===p)this.board.remove(p.row,p.col);
      }
      if(!p.alive&&this.board.grid[p.row][p.col]===p)this.board.remove(p.row,p.col);
    }
    this.plants=this.plants.filter(p=>p.alive);
    this.zombies=this.zombies.filter(z=>z.alive);
    this.peas=this.peas.filter(p=>p.alive);
    this.needles=this.needles.filter(n=>n.alive);
    this.shells=this.shells.filter(s=>s.alive);
    this.minis=this.minis.filter(m=>m.alive);
    this.suns=this.suns.filter(s=>s.alive);
    this.effects=this.effects.filter(e=>e.alive);
    document.getElementById("sv").textContent=Math.floor(this.sun);
  }
  waveInt(w){return w===0?20:w===1?20:w===2?15:w===3?13:12}
  valWave(w){const t={1:1,2:1,3:2,4:2,5:4,6:5,7:8,8:8,9:8,10:11,11:11,12:12,13:12,14:13,15:14,16:14,
    17:15,18:15,19:16,20:16,21:17,22:17,23:17,24:17,25:17};return t[w]||17}
  buildWave(){
    const w=this.wave,val=this.valWave(w);
    this.lastVal=val;
    const rMax=w<=6?0:(w<=14?2:3);
    const aMax=w<=19?0:(w<=21?1:(w<=24?2:3));
    let rem=val;const list=[];
    let c=0;while(c<aMax&&rem>=6){list.push("armored");rem-=6;c++}
    c=0;while(c<rMax&&rem>=3){list.push("runner");rem-=3;c++}
    while(rem>=1){list.push("normal");rem-=1}
    list.sort(()=>Math.random()-.5);
    this.queue=list;
    this.spawnI=list.length>0?this.waveInt(w)/list.length:0;
    this.spawnT=0;
  }
  spawnZ(type){
    const row=ri(0,this.board.rows-1);
    const x=this.board.ox+this.board.cols*this.board.cw+10+ri(0,60);
    const c=this.board.center(row,0);
    const w=this.board.cw*.6,h=this.board.ch*.7;
    this.zombies.push(new Zombie(type,row,x,c.y-h/2,w,h));
  }
  draw(){
    const ctx=this.ctx,b=this.board;
    ctx.clearRect(0,0,this.width,this.height);
    ctx.fillStyle="#5a8f3a";ctx.fillRect(0,0,this.width,this.height);
    ctx.strokeStyle="rgba(0,0,0,.15)";ctx.lineWidth=1;
    for(let r=0;r<=b.rows;r++){ctx.beginPath();ctx.moveTo(b.ox,b.oy+r*b.ch);ctx.lineTo(b.ox+b.cols*b.cw,b.oy+r*b.ch);ctx.stroke()}
    for(let c=0;c<=b.cols;c++){ctx.beginPath();ctx.moveTo(b.ox+c*b.cw,b.oy);ctx.lineTo(b.ox+c*b.cw,b.oy+b.rows*b.ch);ctx.stroke()}
    const gs=this.plants.filter(p=>p.type==="anka"&&p.form===2);
    const gr=this.plants.filter(p=>p.type==="spike");
    const up=this.plants.filter(p=>p.type!=="spike"&&!(p.type==="anka"&&p.form===2));
    for(const p of gs)p.draw(ctx);
    for(const p of gr)p.draw(ctx);
    for(const p of up)p.draw(ctx);
    for(const m of this.minis)m.draw(ctx);
    for(const z of this.zombies)z.draw(ctx);
    for(const p of this.peas)p.draw(ctx);
    for(const n of this.needles)n.draw(ctx);
    for(const s of this.shells)s.draw(ctx);
    for(const e of this.effects)e.draw(ctx);
    for(const s of this.suns)s.draw(ctx);
    document.getElementById("dbg").textContent=
      `FPS:${this._fps} Z:${this.zombies.length} B:${this.plants.length} M:${this.minis.length} D:${this.wave} Değer:${this.lastVal}`;
  }
}

cv.addEventListener("touchstart",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(),t=e.touches[0];
  game.onPointer(t.clientX-r.left,t.clientY-r.top);
},{passive:false});
cv.addEventListener("mousedown",e=>{
  const r=cv.getBoundingClientRect();
  game.onPointer(e.clientX-r.left,e.clientY-r.top);
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)game.lastTime=performance.now()});
game.resize();
game.showMenu();
requestAnimationFrame(game._loop);
