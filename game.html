<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvZ Fan - Test</title>
<style>
  body{background:#1a1a2e;color:#fff;font-family:system-ui;padding:24px;line-height:1.6;margin:0}
  h1{color:#4caf50;font-size:22px}
  .ok{color:#0f0}
  .kutu{background:#2a2a4a;padding:16px;border-radius:10px;margin-top:12px}
  .kutu p{margin:4px 0;font-size:14px}
  small{color:#8fb8de}
</style>
</head>
<body>
  <h1>🌻 PvZ Fan - Modüler Test</h1>
  <div id="test">Yükleniyor...</div>

  <script type="module">
    import {CFG, PL, ZB, BADGE} from './js/config.js';
    import {cl, ri, rf, col} from './js/utils.js';

    const bitkiSayisi = Object.keys(PL).length;
    const zombiSayisi = Object.keys(ZB).length;

    document.getElementById('test').innerHTML = `
      <div class="kutu">
        <p class="ok">✅ Config yüklendi</p>
        <p>Sütun: ${CFG.COLS}, Satır: ${CFG.ROWS}</p>
        <p>Bitki sayısı: ${bitkiSayisi}</p>
        <p>Zombi sayısı: ${zombiSayisi}</p>
      </div>
      <div class="kutu">
        <p class="ok">✅ Utils yüklendi</p>
        <p>cl(150, 0, 100) = ${cl(150, 0, 100)} <small>(100 olmalı)</small></p>
        <p>ri(1, 5) = ${ri(1, 5)} <small>(1-5 arası)</small></p>
        <p>rf(0, 1) = ${rf(0, 1).toFixed(3)} <small>(0-1 arası)</small></p>
        <p>col(a, b) = ${col({x:0,y:0,w:10,h:10}, {x:5,y:5,w:10,h:10})} <small>(true olmalı)</small></p>
      </div>
      <p style="font-size:18px;text-align:center;margin-top:24px;color:#0f0">🎉 Her şey çalışıyor!</p>
    `;
  </script>
</body>
</html>
