<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvZ Fan - Test</title>
<style>
  body{background:#1a1a2e;color:#fff;font-family:system-ui;padding:24px;line-height:1.6;margin:0}
  h1{color:#4caf50;font-size:22px}
  .ok{color:#0f0}
  .kutu{background:#2a2a4a;padding:16px;border-radius:10px;margin-top:12px}
  .kutu p{margin:4px 0;font-size:14px}
  small{color:#8fb8de}
</style>
</head>
<body>
  <h1>🌻 PvZ Fan - Modüler Test</h1>
  <div id="test">Yükleniyor...</div>

  <script type="module">
  import {CFG, PL, ZB, BADGE} from './js/config.js';
  import {cl, ri, rf, col} from './js/utils.js';
  import {Entity, Board} from './js/entities.js';
  import {Boom, Heal} from './js/effects.js';
  import {Pea, Needle, Shell, Sun} from './js/projectiles.js';
  import {Zombie} from './js/zombies.js';
  import {Plant, Mini, BH} from './js/plants.js';

  // Test bitkileri
  const p1 = new Plant("peashooter", 0, 0, 0, 0, 50, 50);
  const p2 = new Plant("anakok", 1, 1, 60, 60, 50, 50);
  const p3 = new Plant("sunflower", 2, 2, 120, 120, 50, 50);

  // Mini testi
  const mini = new Mini(0, 0, 0, 0, 40, 40);

  // Bitki hasar testi
  p1.hit(100);
  const p1hp = p1.hp; // 300 - 100 = 200

  // Kalkan testi
  p2.shield = 150;
  p2.hit(50);
  const p2shield = p2.shield; // 150 - 50 = 100
  const p2hp = p2.hp; // 300 (dokunulmadı)

  document.getElementById('test').innerHTML = `
    <div class="kutu">
      <p class="ok">✅ Tüm modüller yüklendi</p>
      <p>Config + Utils + Entity + Board + Effects + Projectiles + Zombies + Plants</p>
    </div>
    <div class="kutu">
      <p class="ok">✅ Bitki tipleri oluştu</p>
      <p>Bezelye: hp=${p1.mhp}, dmg=${PL.peashooter.dmg}, cd=${PL.peashooter.cd}</p>
      <p>Ana Kök: hp=${p2.mhp}, dmg=${PL.anakok.dmg}, cd=${PL.anakok.cd}</p>
      <p>Ayçiçeği: hp=${p3.mhp}, rate=${PL.sunflower.rate}</p>
    </div>
    <div class="kutu">
      <p class="ok">✅ Mini Filiz oluştu</p>
      <p>HP: ${mini.hp}/${mini.mhp}, erime: ${CFG.MINI_DECAY}/sn</p>
    </div>
    <div class="kutu">
      <p class="ok">✅ Hasar + kalkan sistemi çalışıyor</p>
      <p>Bezelye 100 hasar aldı → kalan HP: ${p1hp} <small>(200 olmalı)</small></p>
      <p>Ana Kök 50 hasar aldı (kalkan vardı) → HP: ${p2hp}, kalkan: ${p2shield} <small>(300 HP, 100 kalkan)</small></p>
    </div>
    <div class="kutu">
      <p class="ok">✅ Davranışlar yüklendi</p>
      <p>Toplam davranış: ${Object.keys(BH).length} <small>(9 olmalı)</small></p>
    </div>
    <p style="font-size:18px;text-align:center;margin-top:24px;color:#0f0">🎉 Adım 5 tamam!</p>
  `;
</script>
</body>
</html>
