<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvZ Fan - Test</title>
<style>
  body{background:#1a1a2e;color:#fff;font-family:system-ui;padding:24px;line-height:1.6;margin:0}
  h1{color:#4caf50;font-size:22px}
  .ok{color:#0f0}
  .kutu{background:#2a2a4a;padding:16px;border-radius:10px;margin-top:12px}
  .kutu p{margin:4px 0;font-size:14px}
  small{color:#8fb8de}
</style>
</head>
<body>
  <h1>🌻 PvZ Fan - Modüler Test</h1>
  <div id="test">Yükleniyor...</div>

  <script type="module">
    import {CFG, PL, ZB, BADGE} from './js/config.js';
    import {cl, ri, rf, col} from './js/utils.js';
    import {Entity, Board} from './js/entities.js';
    import {Boom, Heal} from './js/effects.js';
    import {Pea, Needle, Shell, Sun} from './js/projectiles.js';
    import {Zombie} from './js/zombies.js';

    // Test zombileri
    const z1 = new Zombie("normal", 0, 800, 100, 40, 50);
    const z2 = new Zombie("runner", 1, 800, 200, 40, 50);
    const z3 = new Zombie("armored", 2, 800, 300, 40, 50);

    // Hasar testi
    z1.hit(100);
    const z1hp = z1.hp;

    // Zayıflatma testi
    z2.weakenTimer = 1.5;
    const z2dmgWeak = z2.dmg * PL.ignear.wm;

    document.getElementById('test').innerHTML = `
      <div class="kutu">
        <p class="ok">✅ Tüm modüller yüklendi</p>
        <p>Config + Utils + Entity + Board + Effects + Projectiles + Zombies</p>
      </div>
      <div class="kutu">
        <p class="ok">✅ Zombi tipleri oluştu</p>
        <p>Normal: hp=${z1.mhp}, spd=${z1.speed}, dmg=${z1.dmg}</p>
        <p>Koşucu: hp=${z2.mhp}, spd=${z2.speed}, dmg=${z2.dmg}</p>
        <p>Zırhlı: hp=${z3.mhp}, spd=${z3.speed}, dmg=${z3.dmg}</p>
      </div>
      <div class="kutu">
        <p class="ok">✅ Hasar sistemi çalışıyor</p>
        <p>Normal 100 hasar aldı → kalan HP: ${z1hp} <small>(140 olmalı)</small></p>
        <p>Zayıflatılmış koşucu hasarı: ${z2dmgWeak.toFixed(1)} <small>(90.0 olmalı)</small></p>
      </div>
      <p style="font-size:18px;text-align:center;margin-top:24px;color:#0f0">🎉 Adım 4 tamam!</p>
    `;
  </script>
</body>
</html>
